[package]
name = "mxm-drum-machine"
description = "Sixteen-slot circuit-modelled drum instrument"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nice-plug.workspace = true
nice-plug-egui.workspace = true
mxm-ui.workspace = true
mxm-preset.workspace = true
mxm-tempo.workspace = true
mxm-modulation-params.workspace = true
mxm-part-routing.workspace = true
egui.workspace = true
mxm-drum-machine-dsp.workspace = true
# Writes the sample pack (plan §4.7). The collection's first plugin to ship the encoder: the
# player already had it and every other consumer takes it as a dev-dependency. No MPL travels
# with it — symphonia lives only in `mxm-audio-file-decode`, which this plugin does not take.
mxm-audio-file.workspace = true
dirs = "=5.0.1"
# The Export pack folder chooser (owner, 2026-09-21). Same pin as the two plugins that already
# ship it; this is the collection's first *folder* pick, and its Linux portal path is unverified
# from this machine — `AGENTS.md` records that rather than implying it works.
rfd = "=0.15.4"

[dev-dependencies]
# The collection's shared headless checks (`crates/mxm-plugin-test`).
mxm-plugin-test.workspace = true
# `wgpu` renders a frame to pixels for the layout-tree review pictures
# (`mxm_plugin_test::tree_checks`, `editor::tests::tree_pictures`). Test-only: nothing here reaches
# the bundle.
egui_kittest = { version = "=0.36.1", features = ["wgpu"] }
image = { version = "=0.25.9", default-features = false, features = ["png"] }
# The modulation standard's declaration (`mxm_drum_machine_dsp::conformance::Declared`): a route
# slot's amount is held to every pair's offer (`routes.rs`). It held each pair's own parameter
# through `mxm_plugin_test::routing_checks` until 2026-10-07, when the routes became four slots a
# drum. Test-only features, so the bundle carries neither.
mxm-modulation = { workspace = true, features = ["conformance"] }
mxm-drum-machine-dsp = { workspace = true, features = ["conformance"] }
