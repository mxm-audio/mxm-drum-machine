[package]
name = "mxm-drum-machine"
description = "Sixteen-slot circuit-modelled drum instrument"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
mxm-editor.workspace = true
# `vst3` exports the VST3 as well as the CLAP (`nice_export_vst3!`); the bundler makes a `.vst3`
# whenever the library exports one.
nice-plug = { workspace = true, features = ["vst3"] }
mxm-ui.workspace = true
mxm-preset.workspace = true
mxm-params.workspace = true
mxm-telemetry.workspace = true
mxm-tempo.workspace = true
mxm-modulation-params.workspace = true
mxm-part-routing.workspace = true
egui.workspace = true
mxm-drum-machine-dsp.workspace = true
# The slot names, Resample's capture thread and state machine, the sample pack and the editor's
# Resample, Export and name box, shared with mxm-model-drums (mxm-kit's `crates/mxm-drum-shell`):
# the pack's encoder, its folder pick and the names' field come with it.
mxm-drum-shell.workspace = true

[dev-dependencies]
# The collection's shared headless checks (`crates/mxm-plugin-test`).
mxm-plugin-test.workspace = true
# The slot names' field as the test that restores it through the wrapper writes it
# (`slot_names::tests::through_the_wrapper`). Pinned as the lock has it.
serde_json = "=1.0.145"
# The note-name extension's C types, for the test that reads the slot names as a host does
# (`slot_names::tests::through_the_wrapper`). Pinned as the lock has it, through nice-plug.
clap-sys = "=0.5.0"
# `wgpu` renders a frame to pixels for the layout-tree review pictures
# (`mxm_plugin_test::tree_checks`, `editor::tests::tree_pictures`). Test-only: nothing here reaches
# the bundle.
egui_kittest = { version = "=0.36.1", features = ["wgpu"] }
image = { version = "=0.25.9", default-features = false, features = ["png"] }
# The modulation standard's declaration (`mxm_drum_machine_dsp::conformance::Declared`): a route
# slot's amount is held to every pair's offer (`routes.rs`). It held each pair's own parameter
# through `mxm_plugin_test::routing_checks` until 2026-10-07, when the routes became four slots a
# drum. Test-only features, so the bundle carries neither.
mxm-modulation = { workspace = true, features = ["conformance"] }
mxm-drum-machine-dsp = { workspace = true, features = ["conformance"] }
